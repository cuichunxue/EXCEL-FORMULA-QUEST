<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXCEL FORMULA QUEST</title>
  <meta name="description" content="関数を覚えるな。仕事を解決せよ。実務Jobから学ぶExcel関数・問題解決学習システム。">
  <meta name="theme-color" content="#1B2838">
  <link rel="icon" href="assets/img/icons/condition.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" title="トップへ">
      <span class="brand-x" aria-hidden="true">X</span><span class="brand-t">FORMULA QUEST</span>
    </button>
    <div class="top-mid"><span id="topTitle"></span><span id="topExtra"></span></div>
    <div class="top-actions">
      <button class="tbtn rescue" id="rescueBtn" title="10秒RESCUE">⚡<span>RESCUE</span></button>
      <button class="tbtn" id="soundBtn" aria-pressed="false" title="効果音">🔇</button>
      <button class="tbtn" id="settingsBtn" title="設定">⚙</button>
      <button class="tbtn" id="exitBtn" title="ここで終える" hidden>✕</button>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="caption" class="caption" aria-live="polite"></div>
  <div id="toast" class="toast" role="status"></div>
  <div id="overlay" class="overlay" hidden></div>
  <noscript><p style="padding:24px;color:#fff">このアプリの実行には JavaScript が必要です。</p></noscript>
  <script src="js/formula.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
